name: code-checks

# Controls when the workflow will run
on:
  # Triggers the workflow on push events
  push:
    branches: [ 'main' ]
    tags-ignore: [ '**' ]

  # Triggers the workflow on pull request events
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code_checks:
    name: code checks

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # false: try to complete all jobs
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[tests,examples] ./lint_rules
        pip list
    - name: Add pylint annotator
      uses: pr-annotators/pylint-pr-annotator@9c31057f2f495d9aee9b96e10299cc6b0a010cc2  # v0.0.1
    - name: Analysing the code with pylint
      run: |
        pylint --rcfile=.pylintrc loki
        pushd lint_rules && pylint --rcfile=../.pylintrc lint_rules tests; popd
        jupyter nbconvert --to=script --output-dir=example_converted example/*.ipynb
        pylint --rcfile=.pylintrc_ipynb example_converted/*.py
    - name: Check REUSE compliance for license coverage
      run: |
        reuse lint
